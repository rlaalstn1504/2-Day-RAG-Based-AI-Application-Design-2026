<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc">
  <title id="title">RAG 체인의 데이터 흐름</title>
  <desc id="desc">질문이 question과 context 두 갈래로 처리된 뒤 프롬프트, 언어 모델, 문자열 출력 파서를 차례로 거쳐 답변이 되는 과정</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .label { font: 700 21px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #0f172a; }
      .code { font: 700 19px Consolas, 'Malgun Gothic', monospace; fill: #0f172a; }
      .note { font: 400 17px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 3; }
      .box { stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect width="960" height="920" fill="#ffffff"/>
  <text x="480" y="46" text-anchor="middle" class="title">6. RAG 체인 데이터 흐름</text>

  <rect x="350" y="76" width="260" height="76" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="480" y="107" text-anchor="middle" class="label">사용자 질문</text>
  <text x="480" y="135" text-anchor="middle" class="note">문자열 하나가 체인에 입력됨</text>

  <path d="M480 152 V190 M480 190 H250 V220 M480 190 H710 V220" class="branch"/>
  <polygon points="244,218 256,218 250,230" fill="#64748b"/>
  <polygon points="704,218 716,218 710,230" fill="#64748b"/>

  <rect x="80" y="230" width="340" height="112" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="250" y="269" text-anchor="middle" class="code">"question"</text>
  <text x="250" y="299" text-anchor="middle" class="code">RunnablePassthrough()</text>
  <text x="250" y="327" text-anchor="middle" class="note">질문을 그대로 전달</text>

  <rect x="540" y="230" width="340" height="112" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="710" y="263" text-anchor="middle" class="code">"context"</text>
  <text x="710" y="293" text-anchor="middle" class="code">retriever</text>
  <text x="710" y="321" text-anchor="middle" class="code">→ RunnableLambda(format_docs)</text>

  <path d="M250 342 V385 H480 M710 342 V385 H480 V420" class="branch"/>
  <polygon points="474,408 486,408 480,420" fill="#64748b"/>

  <rect x="260" y="420" width="440" height="88" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="480" y="454" text-anchor="middle" class="code">{"question": 질문, "context": 문서 문자열}</text>
  <text x="480" y="484" text-anchor="middle" class="note">두 결과를 하나의 딕셔너리로 묶음</text>

  <path d="M480 508 V552" class="arrow"/>
  <rect x="310" y="552" width="340" height="78" class="box" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="480" y="585" text-anchor="middle" class="code">rag_prompt</text>
  <text x="480" y="613" text-anchor="middle" class="note">질문과 컨텍스트를 프롬프트에 삽입</text>

  <path d="M480 630 V674" class="arrow"/>
  <rect x="350" y="674" width="260" height="76" class="box" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="480" y="707" text-anchor="middle" class="code">llm</text>
  <text x="480" y="735" text-anchor="middle" class="note">답변 생성</text>

  <path d="M480 750 V794" class="arrow"/>
  <rect x="300" y="794" width="360" height="76" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="480" y="827" text-anchor="middle" class="code">StrOutputParser()</text>
  <text x="480" y="855" text-anchor="middle" class="note">모델 응답에서 문자열만 추출</text>

  <path d="M660 832 H756" class="arrow"/>
  <rect x="756" y="794" width="150" height="76" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="831" y="827" text-anchor="middle" class="label">최종 답변</text>
  <text x="831" y="855" text-anchor="middle" class="note">문자열</text>
</svg>
